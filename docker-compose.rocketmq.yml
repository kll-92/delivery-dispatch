services:
  rocketmq-init:
    image: apache/rocketmq:5.3.2
    user: root
    command: >-
      sh -c "chown -R 3000:3000 /namesrv-logs /broker-logs /broker-store"
    volumes:
      - delivery-rocketmq-namesrv-logs:/namesrv-logs
      - delivery-rocketmq-broker-logs:/broker-logs
      - delivery-rocketmq-broker-store:/broker-store

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: delivery-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "19876:9876"
    volumes:
      - delivery-rocketmq-namesrv-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
    networks:
      - delivery-rocketmq

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: delivery-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_started
    ports:
      - "20909:20909"
      - "20911:20911"
      - "20912:20912"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - delivery-rocketmq-broker-logs:/home/rocketmq/logs
      - delivery-rocketmq-broker-store:/home/rocketmq/store
    networks:
      - delivery-rocketmq

networks:
  delivery-rocketmq:
    name: delivery-rocketmq

volumes:
  delivery-rocketmq-namesrv-logs:
  delivery-rocketmq-broker-logs:
  delivery-rocketmq-broker-store:
