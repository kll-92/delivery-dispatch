<h1>Redis 快速参考：在配送项目中怎么用</h1>
<table><tr><th>东西</th><th>它是什么</th><th>本项目的用法</th></tr>
<tr><td>Redis</td><td>基于内存的 Key-Value 数据库</td><td>放高频读取、可短暂存在的数据</td></tr>
<tr><td>MySQL</td><td>持久化关系数据库</td><td>订单、骑手正式数据的最终事实</td></tr>
<tr><td>String</td><td>单个值，支持原子递增</td><td>骑手接单数的高并发控制（后续）</td></tr>
<tr><td>GEO</td><td>存储经纬度、按半径搜索</td><td>找商家附近的可用骑手（后续）</td></tr>
</table>
<h2>一条总原则</h2><p>MySQL 保证数据最终正确且可持久化；Redis 用于让高频操作更快。Redis 不是简单取代 MySQL。</p>
</body></html>
