<div id="cache-avalanche-explainer" style="font-family:ui-sans-serif,system-ui,sans-serif;color:var(--foreground);max-width:760px;margin:0 auto">
  <style>
    #cache-avalanche-explainer .row{display:grid;grid-template-columns:116px 1fr;gap:12px;align-items:start;margin:14px 0}
    #cache-avalanche-explainer .label{font-weight:700;padding-top:9px}
    #cache-avalanche-explainer .track{position:relative;height:72px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--background) 82%,var(--foreground) 4%)}
    #cache-avalanche-explainer .tick{position:absolute;bottom:5px;font-size:12px;color:color-mix(in srgb,var(--foreground) 65%,transparent)}
    #cache-avalanche-explainer .key{position:absolute;top:12px;width:27px;height:27px;border-radius:50%;background:var(--viz-series-1);border:2px solid var(--background);transform:translateX(-50%)}
    #cache-avalanche-explainer .key::after{content:attr(data-name);position:absolute;top:31px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--foreground)}
    #cache-avalanche-explainer .burst{position:absolute;top:4px;bottom:0;width:3px;background:#d84545;left:78%}
    #cache-avalanche-explainer .burst span{position:absolute;top:-2px;left:8px;color:#d84545;font-size:12px;white-space:nowrap;font-weight:700}
    #cache-avalanche-explainer .spread{position:absolute;top:4px;bottom:0;width:3px;background:var(--viz-series-3)}
    #cache-avalanche-explainer .note{margin:10px 0 0 128px;font-size:13px;color:color-mix(in srgb,var(--foreground) 75%,transparent)}
    @media(max-width:520px){#cache-avalanche-explainer .row{grid-template-columns:1fr}#cache-avalanche-explainer .label{padding:0}#cache-avalanche-explainer .note{margin-left:0}}
  </style>
  <div class="row"><div class="label">固定 TTL<br><small>都 600 秒</small></div><div class="track"><div class="key" style="left:18%" data-name="骑手 A"></div><div class="key" style="left:38%" data-name="骑手 B"></div><div class="key" style="left:58%" data-name="骑手 C"></div><div class="burst"><span>同一时刻失效 → MySQL 突发回源</span></div><span class="tick" style="left:2%">写入</span><span class="tick" style="left:74%">600 秒</span></div></div>
  <div class="row"><div class="label">随机 TTL<br><small>600～660 秒</small></div><div class="track"><div class="key" style="left:18%" data-name="骑手 A"></div><div class="key" style="left:38%" data-name="骑手 B"></div><div class="key" style="left:58%" data-name="骑手 C"></div><div class="spread" style="left:70%"></div><div class="spread" style="left:79%"></div><div class="spread" style="left:88%"></div><span class="tick" style="left:2%">写入</span><span class="tick" style="left:67%">600</span><span class="tick" style="left:86%">660 秒</span></div></div>
  <div class="note">随机 TTL 的目标：把“同一秒的大量回源”摊成一段时间内的少量回源。</div>
</div>
