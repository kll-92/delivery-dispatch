server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端调 /api/** 时反代到后端容器。
    # 前后端同源（都在这个 nginx 后面），所以不需要 CORS 配置。
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 必须关缓冲，否则流式响应会被攒成一坨再返回
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Vue Router 用的是 history 模式：
    # 刷新 /admin 这类路径时，磁盘上没有 admin 文件，必须回退到 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
